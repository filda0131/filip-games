function row(...els){let d=document.createElement('div');d.className='row';els.forEach(e=>d.append(e));stage.append(d);return d}

function rand(n){return Math.floor(Math.random()*n)}
function snake(){
 if(timer){clearInterval(timer);timer=null}
 if(raf){cancelAnimationFrame(raf);raf=null}
 stage.innerHTML='<p>Ovládání: šipky nebo WASD. Had přechází přes hrany a pohybuje se po všech šesti stěnách.</p><canvas id="c" width="760" height="600"></canvas><div class="row pad" id="pad"></div><div class="row"><button id="again">Nová hra</button></div>';
 const c=document.querySelector('#c'),ctx=c.getContext('2d'),N=7,M=N-1,half=M/2;
 const faces=[
  {n:[0,0,1],u:[1,0,0],v:[0,1,0]},
  {n:[0,0,-1],u:[-1,0,0],v:[0,1,0]},
  {n:[1,0,0],u:[0,0,-1],v:[0,1,0]},
  {n:[-1,0,0],u:[0,0,1],v:[0,1,0]},
  {n:[0,1,0],u:[1,0,0],v:[0,0,-1]},
  {n:[0,-1,0],u:[1,0,0],v:[0,0,1]}
 ];
 const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
 const add=(a,b)=>a.map((x,i)=>x+b[i]),mul=(a,k)=>a.map(x=>x*k);
 const pos=s=>add(mul(faces[s.f].n,half+.045),add(mul(faces[s.f].u,s.u-half),mul(faces[s.f].v,s.v-half)));
 const faceFor=n=>faces.findIndex(f=>f.n.every((x,i)=>x===n[i]));
 const coords=(f,p)=>{const q=p.map((x,i)=>x-faces[f].n[i]*(half+.045));return {f,u:dot(q,faces[f].u)+half,v:dot(q,faces[f].v)+half}};
 let body=[{f:0,u:2,v:3,du:1,dv:0},{f:0,u:1,v:3,du:1,dv:0},{f:0,u:0,v:3,du:1,dv:0}],food=null,over=false,points=0;
 let spin=-.2,pitch=.10,last=0;
 const stars=Array.from({length:170},()=>({x:Math.random()*760,y:Math.random()*600,r:Math.random()*1.2+.25,a:Math.random()*.6+.18}));
 function setDir(du,dv){const h=body[0];if(du===-h.du&&dv===-h.dv)return;h.want={du,dv}}
 function nextCell(s){
   const f=faces[s.f],u=s.u+s.du,v=s.v+s.dv;
   if(u>=0&&u<N&&v>=0&&v<N)return {...s,u,v,want:null};
   const step=add(mul(f.u,s.du),mul(f.v,s.dv));
   const nf=faceFor(step);
   // Přechod přes hranu na sousední stěnu krychle.
   const q=coords(nf,pos(s)),heading=mul(f.n,-1);
   return {f:nf,u:Math.max(0,Math.min(M,Math.round(q.u))),v:Math.max(0,Math.min(M,Math.round(q.v))),
     du:dot(heading,faces[nf].u),dv:dot(heading,faces[nf].v),want:null};
 }
 function placeFood(){do{food={f:rand(6),u:rand(N),v:rand(N)}}while(body.some(s=>{const a=pos(s),b=pos(food);return a.every((x,i)=>Math.abs(x-b[i])<.01)}))}
 placeFood();
 // Kamera se dívá shora; krychle se otáčí kolem osy pohledu jako ve videu.
 function rotate(p){
   const ca=Math.cos(spin),sa=Math.sin(spin),cp=Math.cos(pitch),sp=Math.sin(pitch);
   const x=p[0]*ca-p[1]*sa,y=p[0]*sa+p[1]*ca,z=p[2];
   return [x,y*cp-z*sp,y*sp+z*cp];
 }
 function project(p){const q=rotate(p),k=39;return {x:380+q[0]*k,y:300-q[1]*k,z:q[2]}}
 function polygon(points,fill,stroke='rgba(75,255,210,.48)'){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.25;ctx.stroke()}
 function facePoint(f,u,v,offset=0){const b=faces[f];return add(mul(b.n,half+offset),add(mul(b.u,u-half),mul(b.v,v-half)))}
 function drawFace(f){
   const corners=[facePoint(f,-.5,-.5),facePoint(f,N-.5,-.5),facePoint(f,N-.5,N-.5),facePoint(f,-.5,N-.5)].map(project);
   polygon(corners,'rgba(8,24,31,.38)','rgba(75,255,210,.58)');
   ctx.strokeStyle='rgba(75,190,180,.22)';ctx.lineWidth=1;
   for(let i=0;i<=N;i++){
     let a=project(facePoint(f,i-.5,-.5,.01)),b=project(facePoint(f,i-.5,N-.5,.01));
     ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
     a=project(facePoint(f,-.5,i-.5,.01));b=project(facePoint(f,N-.5,i-.5,.01));
     ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   }
 }
 function drawPiece(s,color,glow,size=.34){
   const f=faces[s.f],p=facePoint(s.f,s.u,s.v,.075);
   const corners=[add(p,add(mul(f.u,-size),mul(f.v,-size))),add(p,add(mul(f.u,size),mul(f.v,-size))),add(p,add(mul(f.u,size),mul(f.v,size))),add(p,add(mul(f.u,-size),mul(f.v,size)))].map(project);
   ctx.save();ctx.shadowColor=glow;ctx.shadowBlur=18;polygon(corners,color,'rgba(220,255,255,.25)');ctx.restore();
 }
 function draw(){
   ctx.clearRect(0,0,760,600);ctx.fillStyle='#020509';ctx.fillRect(0,0,760,600);
   stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#b9d8df';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
   faces.map((f,i)=>({i,z:project(mul(f.n,half)).z})).sort((a,b)=>a.z-b.z).forEach(o=>drawFace(o.i));
   drawPiece(food,'#ff32cb','#ff13cf',.32);
   body.slice().reverse().forEach((s,i)=>drawPiece(s,i===body.length-1?'#70ffe2':'#20e8b5','#00ffc8',.34));
   const h=project(facePoint(body[0].f,body[0].u,body[0].v,.1));ctx.save();ctx.shadowColor='#00ffc8';ctx.shadowBlur=12;ctx.fillStyle='#063c36';ctx.beginPath();ctx.arc(h.x-4,h.y-3,2.3,0,7);ctx.arc(h.x+4,h.y-3,2.3,0,7);ctx.fill();ctx.restore();
   ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.fillText('3D HAD',22,34);ctx.textAlign='right';ctx.fillText('Skóre: '+points,738,34);ctx.textAlign='left';
   spin+=.0025;
 }
 document.onkeydown=e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')setDir(-1,0);if(k==='arrowright'||k==='d')setDir(1,0);if(k==='arrowup'||k==='w')setDir(0,-1);if(k==='arrowdown'||k==='s')setDir(0,1)};
 [['←',-1,0],['→',1,0],['↑',0,-1],['↓',0,1]].forEach(a=>document.querySelector('#pad').append(btn(a[0],()=>setDir(a[1],a[2]))));
 function tick(){
   if(over)return;const h=body[0],d=h.want||{du:h.du,dv:h.dv};const next=nextCell({...h,du:d.du,dv:d.dv}),np=pos(next);
   if(body.slice(0,-1).some(s=>pos(s).every((x,i)=>Math.abs(x-np[i])<.01))){over=true;setScore('Konec hry! Body: '+points);para('Konec hry! Klikni na Nová hra a zkus to znovu.');return}
   body.unshift(next);
   if(pos(food).every((x,i)=>Math.abs(x-np[i])<.01)){points++;placeFood();setScore('Skóre: '+points)}else body.pop();
 }
 function animate(t){if(!document.querySelector('#c'))return;if(t-last>280){tick();last=t}draw();raf=requestAnimationFrame(animate)}
 document.querySelector('#again').onclick=()=>snake();
 setScore('Skóre: 0');animate(0);
}
async function chess(){
 stage.innerHTML='<p>Vyber si, jak chceš hrát:</p>';
 row(
   btn('Dva hráči na jednom zařízení',()=>launch('two')),
   btn('Proti botovi – střední',()=>launch('medium')),
   btn('Proti botovi – těžký',()=>launch('hard'))
 );
 async function launch(mode){
   stage.innerHTML='<p>Načítám šachová pravidla…</p>';
   let Chess;
   try{
     ({Chess}=await import('https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js'));

 else if(mode===6){let a=rand(8)+2,k=rand(5)+2,s=[a,a+k,a+2*k,a+3*k];para('Doplň řadu: '+s.join(', ')+', …');let i=document.createElement('input');i.type='number';stage.append(i);row(btn('Ověřit',()=>setScore(+i.value===a+4*k?'Správně!':'Správná odpověď: '+(a+4*k))))}
 else if(mode===7){let sy=['⭐','🍀','🔔','💎','🎈','⚽'],t=sy[rand(6)];para('Najdi symbol: '+t);row(...sy.sort(()=>Math.random()-.5).map(s=>btn(s,()=>setScore(s===t?'Našel jsi ho!':'To není on.'))))}
 else if(mode===8){let a=rand(90)+10,b=rand(90)+10;para('Které číslo je větší?');row(btn(String(a),()=>setScore(a>b?'Správně!':'Větší je '+Math.max(a,b))),btn(String(b),()=>setScore(b>a?'Správně!':'Větší je '+Math.max(a,b))))}
 else if(mode===9){let t=rand(9),d=document.createElement('div');d.className='board';d.style.gridTemplateColumns='repeat(3,68px)';stage.append(d);para('Tref políčko se ⭐');for(let j=0;j<9;j++)d.append(btn(j===t?'⭐':'⬜',()=>setScore(j===t?'Přesná trefa!':'Vedle!'),'cell'))}
 else if(mode===10){let q=[['Hlavní město ČR?','Praha',['Praha','Brno','Ostrava']],['Kolik je 9 + 8?','17',['16','17','18']],['Čím dýchají ryby?','Žábrami',['Plícemi','Žábrami','Kůží']]][rand(3)];para(q[0]);row(...q[2].sort(()=>Math.random()-.5).map(v=>btn(v,()=>setScore(v===q[1]?'Správně!':'Odpověď: '+q[1]))))}
 else {let t=rand(50)+1;para('Hádej číslo od 1 do 50.');let i=document.createElement('input');i.type='number';stage.append(i);row(btn('Tipnout',()=>setScore(+i.value===t?'Uhodl jsi!':+i.value<t?'Zkus větší.':'Zkus menší.')),btn('Nové číslo',()=>extraGame(n),'secondary'))}
}
